version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: level_trap_postgres
    restart: always
    environment:
      POSTGRES_USER: level_trap_user
      POSTGRES_PASSWORD: level_trap_password_secure_2026
      POSTGRES_DB: level_trap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U level_trap_user -d level_trap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: level_trap_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: level_trap_user
      DB_PASSWORD: level_trap_password_secure_2026
      DB_NAME: level_trap_db
      JWT_SECRET: production_super_secret_jwt_key_level_trap_2026
      JWT_EXPIRES_IN: 7d
    command: sh -c "npx knex migrate:latest && npx knex seed:run && node src/server.js"

volumes:
  postgres_data:

